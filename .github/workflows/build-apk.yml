name: build-apk

# 推到 GitHub 就自动出 APK，不需要本地环境，也不需要 Muse
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉素材（字体 + 笔顺数据）
        run: node scripts/fetch-assets.mjs

      - name: 打包 assets
        run: bash android/copy-assets.sh

      - name: 补齐 Android SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建 debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon


      - name: 失败时提交构建日志（便于远程排查）
        if: failure()
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace > ../ci-build-error.log 2>&1 || true
          cd ..
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout -B ci-logs
          git add -f ci-build-error.log
          git commit -m "ci: build error log" || true
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: signature-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
