<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121214" />
<title>签名工坊</title>
<style>
  :root[data-theme="dark"] {
    --bg: #121214; --panel: #1C1C20; --stroke: #2A2A30;
    --text: #F2F0EA; --dim: #8A8A94; --accent: #C62828; --chip: #24242A;
  }
  :root[data-theme="light"] {
    --bg: #FAF8F3; --panel: #FFFFFF; --stroke: #E3DED2;
    --text: #1B1B1F; --dim: #6E6A62; --accent: #C62828; --chip: #F1EDE4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    transition: background .2s, color .2s; }
  .app { max-width: 620px; margin: 0 auto; padding: 6px 12px 0; height: 100dvh;
    display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 6px; gap: 8px; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--stroke);
    background: var(--chip); color: var(--text); font-size: 13px; }
  .tab[data-on="1"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .icon { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 16px; display: grid; place-items: center; }
  .stage-wrap { position: sticky; top: 0; z-index: 6; background: var(--bg); padding-bottom: 4px; }
  .stage { position: relative; height: min(42vh, 88vw); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--stroke);
    background: repeating-conic-gradient(#0000 0% 25%, rgba(128,128,128,.16) 0% 50%) 0 0 / 18px 18px; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .badge { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--dim);
    background: rgba(0,0,0,.28); padding: 3px 7px; border-radius: 999px; }
  :root[data-theme="light"] .badge { background: rgba(255,255,255,.72); }
  .busy { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px;
    color: var(--text); background: color-mix(in srgb, var(--bg) 72%, transparent); }
  .busy[hidden] { display: none; }
  .missing { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #fff;
    background: rgba(198,40,40,.82); padding: 3px 8px; border-radius: 999px; }
  .progress { height: 3px; border-radius: 999px; background: var(--stroke); margin: 8px 2px 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; }
  .panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 12px; padding: 4px 0 36px; }
  .row { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 16px; padding: 0 12px; outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  .primary { height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--accent);
    color: #fff; font-size: 14px; font-weight: 600; }
  .group { display: flex; flex-direction: column; gap: 7px; }
  .group > label { font-size: 12px; color: var(--dim); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--stroke);
    background: var(--chip); color: var(--text); font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; gap: 5px; }
  .chip[data-on="1"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--chip)); }
  .chip .sub { font-size: 10px; color: var(--dim); }
  .sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .hint { font-size: 11px; color: var(--dim); }
  .export { display: flex; gap: 8px; margin-top: 2px; }
  .export button { flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 13px; }
  footer { font-size: 11px; color: var(--dim); line-height: 1.7; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(16px);
    opacity: 0; transition: opacity .18s, transform .18s; background: var(--panel); color: var(--text);
    border: 1px solid var(--stroke); padding: 10px 16px; border-radius: 999px; font-size: 13px;
    z-index: 40; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast[data-show="1"] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
    color: var(--dim); font-size: 14px; z-index: 30; }
  .loading[hidden] { display: none; }
</style>
</head>
<body>
<div class="loading" id="loading">正在加载…</div>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <div class="tabs">
      <button class="tab" id="tabCn" data-on="1">中文签名</button>
      <button class="tab" id="tabPort" data-on="0">英文签名 · 移植版</button>
    </div>
    <button class="icon" id="themeBtn" title="切换主题">☾</button>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="badge" id="hud">— fps</div>
      <div class="busy" id="busy" hidden>逐笔分析中…</div>
      <div class="missing" id="missing" hidden></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <div class="panel">
    <!-- ================= 中文签名 ================= -->
    <div id="cnPanel" style="display:flex;flex-direction:column;gap:12px;">
      <div class="row">
        <input id="name" type="text" value="张三" maxlength="8" placeholder="输入名字（最多 8 字）" />
        <button class="primary" id="playBtn">重播</button>
      </div>
      <div class="group"><label>模式</label><div class="chips" id="modeChips"></div>
        <input id="name2" type="text" class="sub-input" placeholder="第二个名字（情侣模式）" maxlength="4" hidden style="height:40px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);padding:0 12px;font-size:14px;" />
      </div>
      <div class="group"><label>字体</label><div class="chips" id="fontChips"></div></div>
      <div class="group"><label>配色</label><div class="chips" id="palChips"></div></div>
      <div class="group"><label>背景</label><div class="chips" id="bgChips"></div></div>
      <div class="group"><label>动效（可叠加）</label><div class="chips" id="fxChips"></div></div>
      <div class="group"><label>首尾动效</label><div class="chips" id="fx2Chips"></div></div>
      <div class="group"><label>装饰</label><div class="chips" id="decoChips"></div></div>
      <div class="group"><label>装饰样式</label><div class="chips" id="decoOptChips"></div></div>
      <div class="group"><label>落款</label><div class="chips" id="stampChips"></div>
        <input id="sealText" type="text" maxlength="2" placeholder="章内文字" hidden style="height:40px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel);color:var(--text);padding:0 12px;font-size:14px;" />
      </div>
      <div class="group"><label>线条</label><div class="chips" id="lineChips"></div></div>
      <div class="group"><label>时长</label><div class="chips" id="durChips"></div><span class="hint" id="durHint"></span></div>
      <div class="export">
        <button id="pngBtn">保存 PNG（当前背景）</button>
        <button id="pngTBtn">存透明 PNG</button>
      </div>
      <footer id="note"></footer>
    </div>

    <!-- ================= 英文签名 · 移植版 ================= -->
    <div id="portPanel" style="display:none;flex-direction:column;gap:12px;">
      <div class="row">
        <input id="portName" type="text" value="Chen Ming" maxlength="24" placeholder="English name" />
        <button class="primary" id="portPlay">重播</button>
      </div>
      <div class="group"><label>画幅</label><div class="chips" id="portAspect"></div></div>
      <div class="group"><label>字号 / 笔宽</label><div class="chips" id="portSize"></div></div>
      <div class="group"><label>笔压 / 首字母</label><div class="chips" id="portPressure"></div></div>
      <div class="group"><label>收笔花体</label><div class="chips" id="portTerminal"></div></div>
      <div class="group"><label>墨色</label><div class="chips" id="portInk"></div></div>
      <div class="group"><label>发光</label><div class="chips" id="portGlow"></div></div>
      <div class="group"><label>装饰</label><div class="chips" id="portDeco"></div></div>
      <div class="group"><label>装饰大小</label><div class="chips" id="portDecoSize"></div></div>
      <div class="group"><label>附加</label><div class="chips" id="portExtras"></div></div>
      <div class="group"><label>时长</label><div class="chips" id="portDur"></div></div>
      <div class="group"><label>背景</label><div class="chips" id="portBg"></div></div>
      <div class="export">
        <button id="portPngBtn">保存 PNG</button>
        <button id="portPngTBtn">存透明 PNG</button>
      </div>
      <footer>移植自 tyx-signature（MIT）：TYX Brush 笔刷引擎、压力模型、矢量装饰、光点入场/离场、下划线 lift。</footer>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
