<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121214" />
<title>签名工坊 · 原型 v0.1</title>
<style>
  :root[data-theme="dark"] {
    --bg: #121214; --panel: #1C1C20; --stroke: #2A2A30;
    --text: #F2F0EA; --dim: #8A8A94; --accent: #C62828; --chip: #24242A;
  }
  :root[data-theme="light"] {
    --bg: #FAF8F3; --panel: #FFFFFF; --stroke: #E3DED2;
    --text: #1B1B1F; --dim: #6E6A62; --accent: #C62828; --chip: #F1EDE4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    transition: background .2s, color .2s; }
  .app { max-width: 560px; margin: 0 auto; padding: 8px 12px 0; height: 100dvh;
    display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 10px; }
  .brand { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .brand .tag { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 6px; }
  .icon { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 17px; display: grid; place-items: center; }
  .stage-wrap { position: sticky; top: 0; z-index: 6; background: var(--bg); padding-bottom: 4px; }
  .stage { position: relative; height: min(42vh, 88vw); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--stroke); background:
      repeating-conic-gradient(#0000 0% 25%, rgba(128,128,128,.16) 0% 50%) 0 0 / 18px 18px; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .badge { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--dim);
    background: rgba(0,0,0,.28); padding: 3px 7px; border-radius: 999px; backdrop-filter: blur(4px); }
  :root[data-theme="light"] .badge { background: rgba(255,255,255,.72); }
  .busy { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px;
    color: var(--text); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(2px); }
  .busy[hidden] { display: none; }
  .missing { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #fff;
    background: rgba(198,40,40,.82); padding: 3px 8px; border-radius: 999px; }
  .progress { height: 3px; border-radius: 999px; background: var(--stroke); margin: 10px 2px 14px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; }
  .panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 12px; padding: 6px 0 36px; }
  .name-row { display: flex; gap: 8px; }
  #name { flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 17px; padding: 0 14px; outline: none; }
  #name:focus { border-color: var(--accent); }
  .primary { height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group > label { font-size: 12px; color: var(--dim); letter-spacing: .5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 9px 13px; border-radius: 11px; border: 1px solid var(--stroke);
    background: var(--chip); color: var(--text); font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; gap: 6px; }
  .chip[data-on="1"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--chip)); }
  .chip .sub { font-size: 10px; color: var(--dim); }
  .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .hint { font-size: 11px; color: var(--dim); }
  .sub-input { height: 40px; margin-top: 8px; width: 100%; border-radius: 11px;
    border: 1px solid var(--stroke); background: var(--panel); color: var(--text);
    font-size: 14px; padding: 0 12px; outline: none; }
  .sub-input:focus { border-color: var(--accent); }
  .export { display: flex; gap: 8px; margin-top: 4px; }
  .export button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--stroke);
    background: var(--panel); color: var(--text); font-size: 14px; }
  footer { font-size: 11px; color: var(--dim); line-height: 1.7; margin-top: 2px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(16px);
    opacity: 0; transition: opacity .18s, transform .18s; background: var(--panel); color: var(--text);
    border: 1px solid var(--stroke); padding: 10px 16px; border-radius: 999px; font-size: 13px;
    z-index: 40; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast[data-show="1"] { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
    color: var(--dim); font-size: 14px; z-index: 9; transition: opacity .25s; }
  .loading[hidden] { display: none; }
</style>
</head>
<body>
<div class="loading" id="loading">正在加载…</div>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <div class="brand">签名工坊<span class="tag">原型 v0.1</span></div>
    <button class="icon" id="themeBtn" title="切换主题">☾</button>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="badge" id="hud">— fps</div>
      <div class="busy" id="busy" hidden>逐笔分析中…</div>
      <div class="missing" id="missing" hidden></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <div class="panel">
    <div class="name-row">
      <input id="name" value="张三" maxlength="8" placeholder="输入名字（最多 8 字）" />
      <button class="primary" id="playBtn">重播</button>
    </div>

    <div class="group">
      <label>模式</label>
      <div class="chips" id="modeChips"></div>
      <input id="name2" class="sub-input" placeholder="第二个名字（情侣模式）" maxlength="4" hidden />
    </div>

    <div class="group">
      <label>字体</label>
      <div class="chips" id="fontChips"></div>
    </div>

    <div class="group">
      <label>配色</label>
      <div class="chips" id="palChips"></div>
    </div>

    <div class="group">
      <label>背景</label>
      <div class="chips" id="bgChips"></div>
    </div>

    <div class="group">
      <label>动效（可叠加）</label>
      <div class="chips" id="fxChips"></div>
    </div>

    <div class="group">
      <label>时长</label>
      <div class="chips" id="durChips"></div>
      <span class="hint" id="durHint"></span>
    </div>

    <div class="group">
      <label>装饰</label>
      <div class="chips" id="decoChips"></div>
    </div>

    <div class="group">
      <label>装饰样式</label>
      <div class="chips" id="decoOptChips"></div>
    </div>

    <div class="group">
      <label>落款</label>
      <div class="chips" id="stampChips"></div>
      <input id="sealText" class="sub-input" placeholder="章内文字（最多 2 字）" maxlength="2" hidden />
    </div>

    <div class="group">
      <label>线条</label>
      <div class="chips" id="lineChips"></div>
    </div>

    <div class="export">
      <button id="pngBtn">保存 PNG（当前背景）</button>
      <button id="pngTBtn">存透明 PNG</button>
    </div>

    <footer id="note"></footer>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
